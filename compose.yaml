services:
  science-core:
    build:
      context: ./services/science-core
    environment:
      SPARK_AGENT_CORE_DATA_DIR: /data
      SPARK_AGENT_CORE_TOKEN: ${SPARK_AGENT_CORE_TOKEN:?SPARK_AGENT_CORE_TOKEN must be non-empty}
      SPARK_AGENT_OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      SPARK_AGENT_LLM_MODEL: ${SPARK_AGENT_LLM_MODEL:-}
      SPARK_AGENT_EMBEDDING_MODEL: ${SPARK_AGENT_EMBEDDING_MODEL:-}
      SPARK_AGENT_RUNTIME_EXCHANGE_DIR: /runtime-data
      SPARK_AGENT_RUNTIME_SOCKET_PATH: /runtime-socket/runtime.sock
      SPARK_AGENT_EXECUTION_TIMEOUT_SECONDS: "120"
      PYTHONPATH: /app/src
    ports:
      # An empty host port asks Docker to allocate one atomically. Developers
      # may pin it with e.g. SPARK_AGENT_CORE_PUBLISH=127.0.0.1:8877:8765.
      - "${SPARK_AGENT_CORE_PUBLISH:-127.0.0.1::8765}"
    volumes:
      - type: bind
        source: ${SPARK_AGENT_CORE_HOST_DATA_DIR:-./.local/science-core}
        target: /data
      - science-runtime-exchange:/runtime-data
      - science-runtime-socket:/runtime-socket
      - ./services/science-core/src:/app/src:ro
    secrets:
      - source: openai-api-key
        target: openai_api_key
        mode: 0400
    depends_on:
      science-runtime:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          data=json.load(urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=2));
          assert data.get('status') == 'ok' and data.get('database') == 'ok'
          and data.get('runtime') == 'ready'
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 12
    restart: unless-stopped

  science-runtime:
    build:
      context: ./services/science-runtime
    environment:
      SCIENCE_RUNTIME_DATA_ROOT: /runtime-data
      SCIENCE_RUNTIME_SOCKET: /runtime-socket/runtime.sock
    volumes:
      - science-runtime-exchange:/runtime-data
      - science-runtime-socket:/runtime-socket
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(2);
          s.connect('/runtime-socket/runtime.sock');
          s.sendall(b'GET /health HTTP/1.0\r\nHost: runtime\r\n\r\n');
          data=b''.join(iter(lambda: s.recv(4096), b''));
          assert b' 200 ' in data and b'"status":"ok"' in data
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped

volumes:
  science-runtime-exchange:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=512m,uid=0,gid=0,mode=0755
  science-runtime-socket:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=16m,uid=10001,gid=10001,mode=0700

secrets:
  openai-api-key:
    environment: SPARK_AGENT_OPENAI_API_KEY_SECRET
