services:
  science-core:
    image: ${SPARK_AGENT_CORE_IMAGE_ID:?SPARK_AGENT_CORE_IMAGE_ID must be a verified image ID}
    pull_policy: never
    environment:
      SPARK_AGENT_CORE_DATA_DIR: /data
      SPARK_AGENT_CORE_TOKEN: ${SPARK_AGENT_CORE_TOKEN:?SPARK_AGENT_CORE_TOKEN must be non-empty}
      SPARK_AGENT_OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      SPARK_AGENT_MODEL_PROVIDER: ${SPARK_AGENT_MODEL_PROVIDER:-custom}
      SPARK_AGENT_MODEL_PROTOCOL: ${SPARK_AGENT_MODEL_PROTOCOL:-openai-compatible}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-}
      SPARK_AGENT_LLM_MODEL: ${SPARK_AGENT_LLM_MODEL:-}
      SPARK_AGENT_EMBEDDING_MODEL: ${SPARK_AGENT_EMBEDDING_MODEL:-}
      SPARK_AGENT_RUNTIME_EXCHANGE_DIR: /runtime-data
      SPARK_AGENT_RUNTIME_SOCKET_PATH: /runtime-socket/runtime.sock
      SPARK_AGENT_EXECUTION_TIMEOUT_SECONDS: "120"
    ports:
      - "127.0.0.1::8765"
    volumes:
      - type: bind
        source: ${SPARK_AGENT_CORE_HOST_DATA_DIR:?SPARK_AGENT_CORE_HOST_DATA_DIR must be an app-private directory}
        target: /data
        bind:
          create_host_path: false
      - science-runtime-exchange:/runtime-data
      - science-runtime-socket:/runtime-socket
    group_add:
      - "10001"
    secrets:
      - source: openai-api-key
        target: openai_api_key
    depends_on:
      science-runtime:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          data=json.load(urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=2));
          assert data.get('status') == 'ok' and data.get('database') == 'ok'
          and data.get('runtime') == 'ready'
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 4g
    cpus: 4.0
    restart: "no"

  science-runtime:
    image: ${SPARK_AGENT_RUNTIME_IMAGE_ID:?SPARK_AGENT_RUNTIME_IMAGE_ID must be a verified image ID}
    pull_policy: never
    environment:
      SCIENCE_RUNTIME_DATA_ROOT: /runtime-data
      SCIENCE_RUNTIME_SOCKET: /runtime-socket/runtime.sock
    volumes:
      - science-runtime-exchange:/runtime-data
      - science-runtime-socket:/runtime-socket
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import socket; s=socket.socket(socket.AF_UNIX); s.settimeout(2);
          s.connect('/runtime-socket/runtime.sock');
          s.sendall(b'GET /health HTTP/1.0\r\nHost: runtime\r\n\r\n');
          data=b''.join(iter(lambda: s.recv(4096), b''));
          assert b' 200 ' in data and b'"status":"ok"' in data
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    restart: "no"

volumes:
  science-runtime-exchange:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=512m,uid=0,gid=0,mode=0755
  science-runtime-socket:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=16m,uid=10001,gid=10001,mode=0710

secrets:
  openai-api-key:
    file: ${SPARK_AGENT_OPENAI_API_KEY_FILE:?SPARK_AGENT_OPENAI_API_KEY_FILE must be an app-private file}
