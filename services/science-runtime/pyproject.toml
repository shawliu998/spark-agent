[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-agent-runtime"
version = "0.1.0"
description = "Isolated Jupyter notebook execution service for Spark Agent."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "ipykernel>=6.29,<8",
  "matplotlib>=3.9,<4",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "pydantic>=2.11,<3",
  "scipy>=1.14,<2",
  "seaborn>=0.13,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pyright[nodejs]>=1.1.408,<2",
  "pytest>=9.0,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7.0,<8",
  "ruff>=0.15,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
exclude = ["**/__pycache__", ".pytest_cache"]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
