[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "open-science-runtime"
version = "0.1.0"
description = "Isolated Jupyter notebook execution service for Open Science Desktop."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "ipykernel>=6.29,<8",
  "matplotlib>=3.9,<4",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "pydantic>=2.11,<3",
  "scipy>=1.14,<2",
  "seaborn>=0.13,<1",
  "uvicorn>=0.35,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
