[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-agent-core"
version = "0.2.0"
description = "Local evidence, provenance, and research workflow service for Spark Agent."
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.15,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "markdown-it-py>=4.2,<5",
  "paper-search-mcp==0.1.4+spark.3",
  "pydantic>=2.11,<3",
  "pymupdf>=1.26,<2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
literature = ["paper-qa==2026.3.18"]
dev = [
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "pyright[nodejs]>=1.1.408,<2",
  "pytest>=9.0,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7.0,<8",
  "ruff>=0.15,<1",
  "scipy>=1.14,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Released revisions are frozen; preserve their exact historical source bytes.
"migrations/versions/*.py" = ["I001"]

[tool.pyright]
exclude = ["**/__pycache__", ".pytest_cache"]
include = ["src", "migrations", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
