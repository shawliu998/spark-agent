name: quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release asset integrity policy
        run: pnpm test:release-assets

      - name: Lint desktop
        run: pnpm lint:desktop

      - name: Type-check desktop
        run: pnpm typecheck:desktop

      - name: Test desktop
        run: pnpm test:desktop

      - name: Fetch pinned OpenCode sidecar for Foundation live smoke
        run: bash scripts/dev/fetch-opencode.sh x86_64-unknown-linux-gnu

      - name: Fetch pinned ripgrep sidecar for Foundation live smoke
        run: bash scripts/dev/fetch-ripgrep.sh x86_64-unknown-linux-gnu

      - name: Test Foundation profile, runtime contracts, and live agent/tool slice
        run: pnpm test:foundation:live

  rust:
    name: Rust desktop
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Tauri Linux dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev build-essential curl \
            wget file libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt
          cache-workspaces: apps/desktop/src-tauri -> target

      - name: Check Rust formatting
        run: bash scripts/quality/run-check.sh rust fmt

      - name: Lint Rust
        run: bash scripts/quality/run-check.sh rust lint

      - name: Test Rust
        run: bash scripts/quality/run-check.sh rust test

  science-core:
    name: Science Core (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: services/science-core/pyproject.toml

      - name: Install science-core development dependencies
        run: python -m pip install --disable-pip-version-check --editable "./services/science-core[literature,dev]"

      - name: Lint science-core
        run: bash scripts/quality/run-check.sh core lint

      - name: Type-check science-core
        run: bash scripts/quality/run-check.sh core typecheck

      - name: Test science-core
        run: bash scripts/quality/run-check.sh core test

  science-runtime:
    name: Science Runtime (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: services/science-runtime/pyproject.toml

      - name: Install science-runtime development dependencies
        run: python -m pip install --disable-pip-version-check --editable "./services/science-runtime[dev]"

      - name: Lint science-runtime
        run: bash scripts/quality/run-check.sh runtime lint

      - name: Type-check science-runtime
        run: bash scripts/quality/run-check.sh runtime typecheck

      - name: Test science-runtime
        run: bash scripts/quality/run-check.sh runtime test

  migrations:
    name: Database migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/science-core/pyproject.toml

      - name: Install science-core development dependencies
        run: python -m pip install --disable-pip-version-check --editable "./services/science-core[dev]"

      - name: Test fresh, legacy, idempotent, versioned, downgrade, and failed migrations
        working-directory: services/science-core
        run: python -m pytest tests/test_migrations.py

  docker-integration:
    name: Docker integration smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Run deterministic Docker integration smoke
        run: pnpm test:integration
